  /v1/responses:
    get:
      operationId: get_v1_responses
      tags:
      - Responses
      summary: Retrieve Responses
      description: Use this endpoint to retrieve responses from your studies. This endpoint allows you to retrieve up to 1000 responses at a time.
      x-source: https://docs.sprig.com/reference/sprig-api/v1/get-v1-responses-1.md
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: The earliest creation data for a generated theme to return, represented as milliseconds from epoch time
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: The latest creation date for a generated theme to return, represented as milleseconds from epoch time
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: A Base64 encoded string representing an opaque cursor position
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Specific number of results to return
      - name: sid
        in: query
        required: false
        schema:
          type: string
        description: An integer id for a specific Survey
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer YOUR_API_KEY
      - name: with_snapshots
        in: query
        required: false
        schema:
          type: string
        description: true/false(default). If true, the API will return visitorSnapshots, which contains all events, attributes, triggeringEvent,
          and eventProperties set for the visitor at the time of survey delivery.
      - name: with_urls
        in: query
        required: false
        schema:
          type: string
        description: true/false (default). If true, the API will return the page URL from which the survey was taken.
      - name: with_meta
        in: query
        required: false
        schema:
          type: string
        description: true/false (default). If true, the API will return the metadata JSON blob containing details available from the client.
      - name: with_custom_metadata
        in: query
        required: false
        schema:
          type: string
        description: true/false (default). If true, the API will return any custom metadata associated with the response (applicable to link platform
          surveys only).
      - name: with_deleted_responses
        in: query
        required: false
        schema:
          type: string
        description: true/false (default). If true, the API will return the responses that have been previously deleted.
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1ResponsesResponse'
      x-evidence:
        kind: documentation
  /v1/surveys:
    get:
      operationId: get_v1_surveys
      tags:
      - Surveys
      summary: Retrieve Surveys
      description: Studies were formerly surveys. This endpoint allows for the export of study configurations. The name will eventually change
        to Study, but at this time survey will be accepted anywhere study appears in the API. This endpoint allows you retrieve up to 1000 surveys
        at a time.
      x-source: https://docs.sprig.com/reference/sprig-api/v1/get-v1-surveys-1.md
      parameters:
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: The earliest creation data for a generated theme to return, represented as milliseconds from epoch time
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: The latest creation date for a generated theme to return, represented as milleseconds from epoch time
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: A Base64 encoded string representing an opaque cursor position
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: One or many of (IN_PROGRESS, PAUSED, COMPLETED, DRAFT, ARCHIVED, NEW). Can be passed as ?status=PAUSED,COMPLETED, ?status[]=PAUSED&status[]=COMPLETED
          or ?status=PAUSED&status=COMPLETED
      - name: limit
        in: query
        required: false
        schema:
          type: string
        description: Specific number of results to return
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer YOUR_API_KEY
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV1SurveysResponse'
      x-evidence:
        kind: documentation
