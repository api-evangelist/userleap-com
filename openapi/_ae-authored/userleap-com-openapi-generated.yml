      operationId: get_v1_themes
      tags:
      - Themes
      summary: Retrieve Themes
      description: Use this endpoint to retrieve themes, along with the responses that are associated with each theme, from your studies.
      x-source: https://docs.sprig.com/reference/sprig-api/v1/get-v1-themes-1.md
