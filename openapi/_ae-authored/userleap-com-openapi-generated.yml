  /v2/purge/visitors:
    post:
      operationId: post_v2_purge_visitors
      tags:
      - Purge
      summary: Purge Visitors
      description: 'The Purge Visitors API helps teams comply with end-user bulk data deletion requests mandated by laws like GDPR and CCPA. This
        endpoint will delete users and all related user data identified by a set of emails, visitor IDs, or user IDs.


        Purge requests default to being processed 10 days after submission, however this delay can be configured via the delaySeconds parameter.
        The endpoint is limited to 100 visitor deletions per request.


        One of email, userId, or visitorId parameter is required to identify the user for data deletion.'
      x-source: https://docs.sprig.com/reference/sprig-api/v2/post-v2-purge-visitors-1.md
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer YOUR_API_KEY
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostV2PurgeVisitorsRequest'
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV2PurgeVisitorsResponse'
      x-evidence:
        kind: documentation
  /v2/users:
    post:
      operationId: post_v2_users
      tags:
      - Users
      summary: Upsert a User
      description: 'Endpoint facilitating the programatic upsertion of a user.


        Users must be upserted 1 at a time.


        Events created for this user are for historical tracking purposes. Any event tied to a user through this endpoint will not trigger a study
        through Sprig''s SDK.


        Attributes and attribute values can be created and tied to a user through this endpoint.'
      x-source: https://docs.sprig.com/reference/sprig-api/v2/post-user-v2-1.md
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: API-Key YOUR_API_KEY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostV2UsersRequest'
      responses:
        '202':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostV2UsersResponse'
      x-evidence:
        kind: documentation
  /v2/users/{userid}:
    get:
      operationId: get_v2_users_userid
      tags:
      - Users
      summary: Retrieve a User
      description: 'Endpoint that allows the retrieval of a visitor based on a known User ID.


        This endpoint can only recover visitors with user IDs, so please ensure your Sprig implementation has user tracking configured correctly
        based on your SDK installation: /docs/Installation/introduction-web/index


        This endpoint will retrieve visitor info, a list of attributes tied to the visitor, and a list of events with relevant filter criteria.'
      x-source: https://docs.sprig.com/reference/sprig-api/v2/get-v2-users-userid-1.md
      parameters:
      - name: userid
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: API-Key YOUR_API_KEY
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetV2UsersUseridResponse'
      x-evidence:
        kind: documentation
components:
  schemas:
    GetV1ResponsesResponse:
      type: object
      properties:
        cursor:
          type: string
        data:
          type: array
          description: Array of response objects
    GetV1SurveysResponse:
      type: object
      properties:
        cursor:
          type: string
        data:
          type: array
          description: Array of survey objects
    GetV1ThemesResponse:
      type: object
      properties:
        cursor:
          type: string
        data:
          type: array
          description: 'Array of theme objects (minimum 1 item, unique items). Each object contains the following fields:'
        data[].createdAt:
          type: string
        data[].id:
          type: number
        data[].questionId:
          type: number
        data[].questionText:
          type: string
        data[].questionType:
          type: string
        data[].response:
          type: string
        data[].responseGroupUid:
          type: string
        data[].surveyId:
          type: number
        data[].theme:
          type: string
        data[].themeDescription:
          type: string
        data[].updatedAt:
          type: string
        data[].visitorId:
          type: number
    PostV2PurgeVisitorsRequest:
      type: object
      properties:
        delaySeconds:
          type: integer
          description: Seconds to wait before starting visitor data purging. This can be used as a safety measure in case the request needs to
            be canceled.
        emails:
          type: array
          description: List of emails for which visitor data will be purged.
        userIds:
          type: array
          description: List of user IDs (external user IDs) for which visitor data will be purged.
        visitorIds:
          type: array
          description: List of visitor IDs for which visitor data will be purged.
    PostV2PurgeVisitorsResponse:
      type: object
      properties:
        requestId:
          type: string
    PostV2UsersRequest:
      type: object
      properties:
        attributes:
          type: object
          description: Key value pairs of attributes
        attributes.attributeName:
          type: string
          description: Attribute name and value. Attributes limited to total of 100 values
        emailAddress:
          type: string
          description: Valid Email to track visitor by
        events:
          type: array
        events[].event:
          type: string
          description: Name of event already being tracked in Sprig
        events[].timestamp:
          type: integer
          description: Unix timestamp in milliseconds
        userId:
          type: string
          description: Existing or desired id for visitor
      required:
      - userId
    PostV2UsersResponse:
      type: object
      properties:
        '202':
          type: string
          description: Accepted
        '400':
          type: string
          description: Bad Request
        '422':
          type: string
          description: Unprocessable Entity
        '500':
          type: string
          description: Something went wrong on Sprig's side. These are very rare :)
    GetV2UsersUseridResponse:
      type: object
      properties:
        '200':
          type: string
          description: OK
        '404':
          type: string
          description: Not Found
        '500':
          type: string
          description: Something went wrong on Sprig's side. These are very rare :)
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
